<h2 id="confirm-title">{{ data.title | transloco }}</h2>
<p>{{ data.message | transloco: data.params }}</p>
@if (data.reason; as reasonField) {
  <app-text-field
    [label]="reasonField.label | transloco"
    [maxLength]="reasonField.maxLength"
    [control]="reason"
  />
}
<div class="actions">
  <button appButton variant="secondary" type="button" (click)="cancel()">
    {{ 'common.actions.cancel' | transloco }}
  </button>
  <button
    appButton
    [variant]="data.danger ? 'danger' : 'primary'"
    type="button"
    (click)="confirm()"
  >
    {{ data.confirmLabel | transloco }}
  </button>
</div>
