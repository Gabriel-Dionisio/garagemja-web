@if (error(); as message) {
  <app-alert kind="error">{{ message }}</app-alert>
} @else if (loading() && !result()) {
  <app-skeleton [label]="'searchVacancies.loading' | transloco" [rows]="3" />
} @else if (result(); as current) {
  @if (current.items.length === 0) {
    <app-empty-state
      icon="parking"
      [title]="'searchVacancies.emptyTitle' | transloco"
      [description]="'searchVacancies.emptyDescription' | transloco"
    />
  } @else {
    <ul
      class="grid"
      [attr.aria-busy]="loading()"
      [attr.aria-label]="'searchVacancies.title' | transloco"
    >
      @for (spot of current.items; track spot.id) {
        <li><app-vacancy-card [spot]="spot" [queryParams]="queryParams()" /></li>
      }
    </ul>
    <app-paginator
      [page]="current.page"
      [size]="current.size"
      [total]="current.total"
      [itemCount]="current.items.length"
      [hasNext]="current.hasNext"
      [sizeOptions]="pageSizes"
      (sizeChange)="sizeChange.emit($event)"
      (pageChange)="pageChange.emit($event)"
    />
  }
}
