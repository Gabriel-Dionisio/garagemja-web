<app-page [fill]="true">
  <app-page-header [title]="'dashboard.title' | transloco" [subtitle]="subtitle()">
    <a appButton variant="secondary" routerLink="/rentals">
      <app-icon name="key" />
      {{ 'dashboard.myRentals' | transloco }}
    </a>
  </app-page-header>

  @if (views().length > 1) {
    <app-chip-group
      [label]="'dashboard.viewLabel' | transloco"
      [options]="options()"
      [value]="view()"
      (valueChange)="choose($event)"
    />
  }

  @switch (view()) {
    @case ('platform') {
      <app-admin-dashboard />
    }
    @case ('manager') {
      <app-manager-dashboard />
    }
    @default {
      <app-owner-dashboard (spots)="setSpots($event)" />
    }
  }
</app-page>
