<app-page size="form">
  <app-page-header [title]="'profile.title' | transloco" />

  @if (loading()) {
    <app-loading-block [label]="'profile.loading' | transloco" />
  } @else {
    @if (error.text(); as message) {
      <app-alert kind="error">{{ message }}</app-alert>
    }
    @if (saved()) {
      <app-alert kind="success">{{ 'profile.saved' | transloco }}</app-alert>
    }
    @if (profile(); as current) {
      <app-card>
        <app-user-summary [name]="current.name" [email]="current.email" />
        <form [formGroup]="form" (ngSubmit)="save()" novalidate>
          <app-form-section>
            <app-text-field
              [label]="'profile.name' | transloco"
              autocomplete="name"
              [maxLength]="150"
              [format]="formatName"
              [control]="form.controls.name"
            />
            <app-text-field
              [label]="'profile.phone' | transloco"
              type="tel"
              inputMode="tel"
              [maxLength]="15"
              [format]="formatPhone"
              [control]="form.controls.phone"
            />
            <app-text-field
              class="wide"
              [label]="'profile.email' | transloco"
              type="email"
              [control]="emailControl"
            />
          </app-form-section>
          <app-form-actions>
            <button appButton type="submit" [loading]="saving()">
              {{ 'profile.save' | transloco }}
            </button>
          </app-form-actions>
        </form>
      </app-card>
    }
  }
</app-page>
