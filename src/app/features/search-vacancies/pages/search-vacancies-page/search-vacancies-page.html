<app-page>
  <app-page-header
    [title]="'searchVacancies.title' | transloco"
    [subtitle]="
      result() ? ('searchVacancies.count' | transloco: { count: result()?.total ?? 0 }) : ''
    "
  />

  <app-filter-panel
    [label]="'searchVacancies.filters.label' | transloco"
    [activeCount]="activeFilters()"
    [(open)]="filtersOpen"
  >
    <app-chip-group
      [label]="'parkingSpots.filter.size' | transloco"
      [options]="sizeTabs"
      [value]="criteria().size"
      (valueChange)="patch({ size: $event })"
    />
    <app-chip-group
      [label]="'searchVacancies.mode.label' | transloco"
      [options]="modeTabs"
      [value]="criteria().hourly ? 'HOURLY' : 'DAILY'"
      (valueChange)="patch({ hourly: $event === 'HOURLY' })"
    />
    <app-chip-group
      [label]="'searchVacancies.sort.label' | transloco"
      [options]="sortTabs"
      [value]="criteria().sort"
      (valueChange)="patch({ sort: $event ?? 'NUMBER' })"
    />
    <app-chip-toggle
      [label]="'parkingSpots.fields.covered' | transloco"
      [pressed]="criteria().covered"
      (toggled)="patch({ covered: !criteria().covered })"
    />
    @if (criteria().condominiumId) {
      <app-chip-toggle
        [label]="'searchVacancies.condominiumFilter' | transloco"
        [pressed]="true"
        (toggled)="patch({ condominiumId: null })"
      />
    }
    <app-vacancy-filter [criteria]="criteria()" (applied)="apply($event)" />
  </app-filter-panel>

  @if (pins().length) {
    <app-map
      class="map"
      [label]="'searchVacancies.map' | transloco"
      [zoomInLabel]="'searchVacancies.zoomIn' | transloco"
      [zoomOutLabel]="'searchVacancies.zoomOut' | transloco"
      [pins]="pins()"
      [selectedId]="criteria().condominiumId"
      (pinClick)="pickCondominium($event)"
    />
  }

  <app-vacancy-results
    [result]="result()"
    [loading]="loading()"
    [error]="error.text()"
    [queryParams]="cardParams()"
    (sizeChange)="changeSize($event)"
    (pageChange)="goTo($event)"
  />
</app-page>
