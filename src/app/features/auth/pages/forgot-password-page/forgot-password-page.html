<app-auth-panel
  [heading]="'auth.forgotPassword.heading' | transloco"
  [subtitle]="'auth.forgotPassword.subtitle' | transloco"
>
  @if (error.text(); as message) {
    <app-alert kind="error">{{ message }}</app-alert>
  }

  @if (sent()) {
    <app-alert kind="success">{{ 'auth.forgotPassword.sent' | transloco }}</app-alert>
  } @else {
    <form appAutofocusFirst class="stack-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-text-field
        [label]="'common.fields.email' | transloco"
        type="email"
        placeholder="email@example.com"
        autocomplete="email"
        inputMode="email"
        [maxLength]="180"
        [format]="formatEmail"
        [control]="form.controls.email"
      />
      <button appButton type="submit" [block]="true" [loading]="submitting()">
        {{ 'auth.forgotPassword.submit' | transloco }}
      </button>
    </form>
  }

  <p class="footer">
    <a routerLink="/login">{{ 'auth.forgotPassword.backToLogin' | transloco }}</a>
  </p>
</app-auth-panel>
