@if (error.text(); as message) {
  <app-alert kind="error">{{ message }}</app-alert>
}

@if (summary(); as current) {
  @if (current.spots === 0) {
    <app-card>
      <app-empty-state
        icon="car"
        [title]="'dashboard.owner.emptyTitle' | transloco"
        [description]="'dashboard.owner.emptyDescription' | transloco"
      />
    </app-card>
  } @else {
    <section class="kpis" [attr.aria-label]="'dashboard.owner.title' | transloco">
      <app-stat-card
        [value]="current.pending"
        [label]="'dashboard.owner.kpi.pending' | transloco"
        [highlight]="current.pending > 0"
        link="/requests"
        [queryParams]="{ status: 'PENDING' }"
      />
      <app-stat-card
        [value]="current.active"
        [label]="'dashboard.owner.kpi.active' | transloco"
        link="/requests"
        [queryParams]="{ status: 'ACTIVE' }"
      />
      <app-stat-card
        [value]="current.upcoming"
        [label]="'dashboard.owner.kpi.upcoming' | transloco"
        link="/requests"
        [queryParams]="{ status: 'APPROVED' }"
      />
      <app-stat-card
        [value]="money()(current.monthEarnings)"
        [label]="'dashboard.owner.kpi.monthEarnings' | transloco"
      />
    </section>
  }
} @else if (!error.text()) {
  <app-skeleton [label]="'dashboard.owner.loading' | transloco">
    <div class="kpis">
      @for (item of placeholders; track item) {
        <app-skeleton-block height="5rem" />
      }
    </div>
  </app-skeleton>
}
