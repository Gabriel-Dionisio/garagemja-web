<nav [attr.aria-label]="'common.pagination.label' | transloco">
  @if (sizeOptions().length) {
    <label class="size">
      {{ 'common.pagination.perPage' | transloco }}
      <select (change)="pickSize($event)">
        @for (option of sizeOptions(); track option) {
          <option [value]="option" [selected]="option === size()">{{ option }}</option>
        }
      </select>
    </label>
  }
  <span class="summary" aria-live="polite">
    @if (range(); as current) {
      {{
        (current.total === undefined ? 'common.pagination.showing' : 'common.pagination.showingOf')
          | transloco: current
      }}
    }
  </span>
  <div class="controls">
    <button
      appIconButton
      type="button"
      [label]="'common.pagination.previous' | transloco"
      [disabled]="!hasPrevious()"
      (click)="pageChange.emit(page() - 1)"
    >
      <app-icon name="chevron-left" />
    </button>
    <button
      appIconButton
      type="button"
      [label]="'common.pagination.next' | transloco"
      [disabled]="!hasNext()"
      (click)="pageChange.emit(page() + 1)"
    >
      <app-icon name="chevron-right" />
    </button>
  </div>
</nav>
