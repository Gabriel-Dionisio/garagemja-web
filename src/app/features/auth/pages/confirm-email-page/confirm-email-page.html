<app-auth-panel
  [heading]="'auth.confirmEmail.heading.' + state() | transloco"
  [subtitle]="state() === 'confirmed' ? ('auth.confirmEmail.success' | transloco) : ''"
>
  @switch (state()) {
    @case ('confirming') {
      <div class="status" role="status">
        <app-spinner />
        <span>{{ 'auth.confirmEmail.confirming' | transloco }}</span>
      </div>
    }
    @case ('failed') {
      <app-alert kind="error">{{
        error.text() ?? ('auth.confirmEmail.invalid' | transloco)
      }}</app-alert>
    }
  }
  @if (state() !== 'confirming') {
    <a appButton routerLink="/login" [queryParams]="loginParams" [block]="true">{{
      'auth.verifyEmail.goToLogin' | transloco
    }}</a>
  }
</app-auth-panel>
