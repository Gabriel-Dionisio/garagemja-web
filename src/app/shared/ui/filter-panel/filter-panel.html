<div class="toolbar">
  <button
    type="button"
    class="toggle"
    [attr.aria-controls]="panelId"
    [attr.aria-expanded]="open()"
    (click)="open.set(!open())"
  >
    <app-icon name="filter" />
    <span class="toggle-label">{{ label() }}</span>
    @if (activeCount() > 0) {
      <span class="count">{{ activeCount() }}</span>
    }
    <app-icon class="chevron" name="chevron-right" />
  </button>
  <ng-content select="[filterActions]" />
</div>

@if (overlay() && open()) {
  <div class="backdrop" aria-hidden="true" (click)="open.set(false)"></div>
}
<div
  class="panel"
  [id]="panelId"
  [hidden]="!open()"
  [attr.role]="overlay() ? 'dialog' : null"
  [attr.aria-modal]="overlay() ? 'true' : null"
  [attr.aria-label]="overlay() ? label() : null"
  [cdkTrapFocus]="overlay() && open()"
  [cdkTrapFocusAutoCapture]="overlay()"
  (keydown.escape)="overlay() && open.set(false)"
>
  @if (overlay()) {
    <header class="panel-header">
      <h2>{{ label() }}</h2>
      <button
        appIconButton
        type="button"
        [label]="'common.actions.close' | transloco"
        (click)="open.set(false)"
      >
        <app-icon name="close" />
      </button>
    </header>
  }
  <ng-content />
</div>
