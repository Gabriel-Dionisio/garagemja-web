<app-text-field
  class="wide"
  [label]="'condominiums.fields.address' | transloco"
  [maxLength]="255"
  showCount
  [control]="controls().address"
/>
<app-text-field
  [label]="'condominiums.fields.number' | transloco"
  [maxLength]="20"
  [control]="controls().number"
/>
<app-text-field
  [label]="'condominiums.fields.district' | transloco"
  [maxLength]="100"
  showCount
  [control]="controls().district"
/>
<app-text-field
  [label]="'condominiums.fields.city' | transloco"
  [maxLength]="100"
  showCount
  [control]="controls().city"
/>
<app-text-field
  [label]="'condominiums.fields.state' | transloco"
  placeholder="UF"
  [format]="formatUf"
  [control]="controls().state"
/>
