<app-scroll-area orientation="horizontal">
  <div class="chips">
    @for (option of options(); track option.value) {
      <button
        type="button"
        [attr.aria-pressed]="option.value === value()"
        (click)="valueChange.emit(option.value)"
      >
        {{ option.label ?? (option.labelKey ?? '' | transloco) }}
      </button>
    }
  </div>
</app-scroll-area>
