<ng-template #body>
  <ng-content select="[leading]" />
  <span class="text"><ng-content /></span>
</ng-template>
@if (link(); as target) {
  <a class="main link" [routerLink]="target" [queryParams]="queryParams()">
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div class="main"><ng-container [ngTemplateOutlet]="body" /></div>
}
<div class="status"><ng-content select="[status]" /></div>
<div class="actions"><ng-content select="[actions]" /></div>
