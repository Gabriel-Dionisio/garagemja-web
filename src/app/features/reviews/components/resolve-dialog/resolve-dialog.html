<form class="body" (ngSubmit)="submit()">
  <h2 id="resolve-title">{{ 'reviews.admin.noteTitle' | transloco }}</h2>
  <app-text-field
    [label]="'reviews.admin.noteLabel' | transloco"
    [control]="note"
    [maxLength]="noteMax"
  />
  @if (error.text(); as message) {
    <app-alert kind="error">{{ message }}</app-alert>
  }
  <app-form-actions>
    <button appButton type="button" variant="secondary" (click)="close()">
      {{ 'common.actions.cancel' | transloco }}
    </button>
    <button appButton type="submit" [loading]="submitting()">
      {{ 'reviews.admin.confirm' | transloco }}
    </button>
  </app-form-actions>
</form>
