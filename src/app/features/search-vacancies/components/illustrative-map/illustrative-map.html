<div class="map" role="img" [attr.aria-label]="'searchVacancies.map.label' | transloco">
  <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <g class="streets">
      <path d="M-5 20 L105 5" />
      <path d="M-5 45 L105 32" />
      <path d="M-5 72 L105 58" />
      <path d="M-5 98 L105 82" />
      <path d="M12 -5 L28 105" />
      <path d="M40 -5 L52 105" />
      <path d="M68 -5 L76 105" />
      <path d="M92 -5 L96 105" />
    </g>
    <g class="minor">
      <path d="M-5 32 L105 18" />
      <path d="M-5 58 L105 45" />
      <path d="M-5 86 L105 70" />
      <path d="M26 -5 L40 105" />
      <path d="M54 -5 L64 105" />
      <path d="M82 -5 L86 105" />
    </g>
    @for (pin of pins; track $index) {
      <g class="pin" [attr.transform]="'translate(' + pin.x + ' ' + pin.y + ')'">
        <path d="M0 0 C-3.2 -4.2 -4 -5.6 -4 -7.4 A4 4 0 1 1 4 -7.4 C4 -5.6 3.2 -4.2 0 0 Z" />
        <circle cy="-7.4" r="1.5" />
      </g>
    }
  </svg>
  <div class="zoom" aria-hidden="true">
    <span class="control">+</span>
    <span class="control">-</span>
  </div>
</div>
