<form class="body" (ngSubmit)="submit()">
  <h2 id="review-title">{{ 'reviews.dialog.title.' + data.subjectKey | transloco }}</h2>
  <p>{{ 'reviews.dialog.hint' | transloco }}</p>
  <app-chip-group
    [label]="'reviews.dialog.rating' | transloco"
    [options]="options"
    [value]="rating()"
    (valueChange)="rating.set($event)"
  />
  <app-text-field
    [label]="'reviews.dialog.comment' | transloco"
    [control]="comment"
    [maxLength]="commentMax"
  />
  @if (error.text(); as message) {
    <app-alert kind="error">{{ message }}</app-alert>
  }
  <app-form-actions>
    <button appButton type="button" variant="secondary" (click)="close()">
      {{ 'common.actions.cancel' | transloco }}
    </button>
    <button appButton type="submit" [loading]="submitting()" [disabled]="!rating()">
      {{ 'reviews.dialog.submit' | transloco }}
    </button>
  </app-form-actions>
</form>
