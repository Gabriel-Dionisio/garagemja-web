<section class="home-page" aria-labelledby="home-heading">
  <h1 id="home-heading" class="sr-only">{{ 'home.title' | transloco }}</h1>

  <div class="hero">
    <picture>
      <source
        type="image/avif"
        srcset="/images/home-hero-800.avif 800w, /images/home-hero-1600.avif 1600w"
        sizes="100vw"
      />
      <source
        type="image/webp"
        srcset="/images/home-hero-800.webp 800w, /images/home-hero-1600.webp 1600w"
        sizes="100vw"
      />
      <img
        src="/images/home-hero-1600.jpg"
        width="1600"
        height="638"
        fetchpriority="high"
        decoding="async"
        alt=""
      />
    </picture>
  </div>

  @if (hasResidency()) {
    <form class="search-panel" [formGroup]="form" (ngSubmit)="search()" novalidate>
      <app-text-field
        class="search-text"
        [label]="'home.search.text' | transloco"
        [placeholder]="'home.search.placeholder' | transloco"
        [maxLength]="100"
        [control]="form.controls.search"
      />
      <app-date-field
        [showLabel]="true"
        [label]="'home.search.start' | transloco"
        [isoValue]="from()"
        [isoMin]="today"
        (isoValueChange)="setFrom($event)"
      />
      <app-date-field
        [showLabel]="true"
        [label]="'home.search.end' | transloco"
        [isoValue]="to()"
        [isoMin]="from() || today"
        (isoValueChange)="to.set($event)"
      />
      <button appButton type="submit">{{ 'home.search.submit' | transloco }}</button>
    </form>
  }

  <section class="featured" aria-labelledby="featured-heading">
    <h2 id="featured-heading">{{ 'home.featuredTitle' | transloco }}</h2>
    @if (loading()) {
      <app-skeleton [label]="'home.loading' | transloco" [rows]="3" />
    } @else if (loadFailed()) {
      <app-alert kind="error">{{ 'home.loadError' | transloco }}</app-alert>
    } @else if (!hasResidency()) {
      <app-empty-state
        icon="building"
        [title]="'home.noResidencyTitle' | transloco"
        [description]="'home.noResidencyDescription' | transloco"
      >
        <a appButton routerLink="/condominiums">{{ 'home.joinAction' | transloco }}</a>
      </app-empty-state>
    } @else {
      <app-vacancy-results
        [result]="result()"
        [loading]="spotsLoading()"
        [error]="spotsError.text()"
        (sizeChange)="changeSize($event)"
        (pageChange)="goTo($event)"
      />
    }
  </section>
</section>
