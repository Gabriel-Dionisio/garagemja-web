<app-page size="form">
  <app-page-header [title]="'settings.title' | transloco" />

  @if (accountError.text(); as message) {
    <app-alert kind="error">{{ message }}</app-alert>
  }
  @if (saved()) {
    <app-alert kind="success">{{ 'settings.account.saved' | transloco }}</app-alert>
  }

  @if (profile(); as current) {
    <app-card>
      <div class="account">
        <app-account-photo
          [profile]="current"
          [roles]="roles()"
          [busy]="photoBusy()"
          (selected)="uploadPhoto($event)"
          (removed)="removePhoto()"
        />
        <app-account-form
          [profile]="current"
          [showPhone]="showPhone()"
          [saving]="saving()"
          (save)="saveAccount($event)"
        />
      </div>
    </app-card>
  } @else if (loading()) {
    <app-loading-block [label]="'settings.account.loading' | transloco" />
  }

  <app-card>
    <app-form-section [heading]="'settings.security.title' | transloco">
      <app-setting-row
        class="wide"
        [label]="'settings.security.changePassword' | transloco"
        [hint]="'settings.security.changePasswordHint' | transloco"
      >
        <button
          appButton
          type="button"
          variant="secondary"
          [loading]="sendingReset()"
          [disabled]="!email()"
          (click)="requestPasswordReset()"
        >
          {{ 'settings.security.sendResetLink' | transloco }}
        </button>
      </app-setting-row>
      @if (resetSent()) {
        <app-alert class="wide" kind="success">{{
          'settings.security.resetSent' | transloco
        }}</app-alert>
      }
      @if (resetError.text(); as message) {
        <app-alert class="wide" kind="error">{{ message }}</app-alert>
      }
      <app-two-factor class="wide" />
    </app-form-section>
  </app-card>

  <app-card>
    <app-form-section [heading]="'settings.events.title' | transloco">
      <app-security-events class="wide" />
    </app-form-section>
  </app-card>

  <app-card>
    <app-form-section [heading]="'settings.preferences.title' | transloco">
      <app-select-field
        class="wide"
        [label]="'settings.preferences.language' | transloco"
        [control]="languageControl"
        [options]="languageOptions"
      />
      <app-setting-row
        class="wide"
        [label]="'settings.preferences.darkTheme' | transloco"
        [hint]="'settings.preferences.themeHint' | transloco"
      >
        <app-switch
          [label]="'settings.preferences.darkTheme' | transloco"
          [checked]="theme.isDark()"
          (toggled)="theme.toggle()"
        />
      </app-setting-row>
    </app-form-section>
  </app-card>
</app-page>
