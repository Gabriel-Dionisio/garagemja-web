<span class="select">
  <select [attr.aria-label]="label()" (change)="onChange($event)">
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.labelKey | transloco }}
      </option>
    }
  </select>
  <app-icon name="chevron-down" />
</span>
